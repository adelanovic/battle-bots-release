name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare pinned game source
        run: npm run sync
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version" }
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
      - name: Test packaged application
        run: node scripts/smoke-test.js dist/win-unpacked/BattleBots.exe
      - name: Test Windows installation and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Calculate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/BattleBotsSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BattleBotsSetup.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Battle-Bots-Windows
          path: |
            dist/BattleBotsSetup.exe
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already published; preserving its tested installer.'
          } else {
            gh release create $env:GITHUB_REF_NAME dist/BattleBotsSetup.exe dist/SHA256SUMS.txt --title "Battle Bots $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
          $global:LASTEXITCODE = 0
